<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <!-- Restrictive single-file policy; inline app code/styles are required. Web Speech uses available browser/device voices; the app configures no audio endpoint. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#173b32" />
  <title>Wordtrail — English vocabulary practice</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1d2d27;
      --muted: #77827b;
      --forest: #173b32;
      --forest-2: #244b40;
      --mint: #e6f1e9;
      --lime: #d9f278;
      --paper: #f5f6f1;
      --white: #fff;
      --line: #e7eae4;
      --surface-card: #ffffff;
      --surface-soft: #fafbf8;
      --surface-raised: #f2f5ef;
      --surface-subtle: #f4f6f1;
      --text-primary: #1d2d27;
      --text-secondary: #5f6f65;
      --text-muted: #78847c;
      --text-subtle: #879189;
      --accent-text: #41664c;
      --accent-surface: #edf4e9;
      --success-surface: #edf6eb;
      --success-text: #3c7750;
      --error-surface: #fff2ed;
      --error-text: #ad5c43;
      --input-surface: #ffffff;
      --coral: #ee8d70;
      --blue: #8bc8d5;
      --gold: #e9bd57;
      --shadow: 0 16px 44px rgba(30, 53, 43, .07);
      --radius: 22px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; background: var(--paper); color: var(--ink); }
    button { font: inherit; color: inherit; }
    button:focus-visible { outline: 3px solid #89b96d; outline-offset: 3px; }
    .skip-link { position: fixed; top: 10px; left: 10px; z-index: 100; transform: translateY(-160%); padding: 10px 13px; border-radius: 10px; background: var(--lime); color: var(--forest); font-size: 12px; font-weight: 760; text-decoration: none; box-shadow: 0 6px 20px rgba(0,0,0,.15); transition: transform .18s ease; }
    .skip-link:focus { transform: translateY(0); outline: 3px solid #fff; outline-offset: 2px; }
    .app-shell { min-height: 100vh; }
    .sidebar {
      width: 246px; position: fixed; inset: 0 auto 0 0; z-index: 10;
      display: flex; flex-direction: column; padding: 27px 18px 18px;
      background: var(--forest); color: #f5f8f2;
    }
    .brand { display: flex; align-items: center; gap: 12px; padding: 0 12px; margin: 0 0 39px; }
    .brand-mark { width: 38px; height: 38px; border-radius: 13px; display: grid; place-items: center; background: var(--lime); color: var(--forest); }
    .brand-mark svg { width: 23px; height: 23px; }
    .brand-name { font-weight: 760; letter-spacing: -.045em; font-size: 20px; }
    .brand-name span { color: var(--lime); }
    .nav-caption { color: #a9bdb2; font-size: 10px; font-weight: 760; letter-spacing: .15em; padding: 0 13px; margin: 0 0 10px; text-transform: uppercase; }
    .nav-list { display: grid; gap: 6px; }
    .nav-button {
      border: 0; color: #d2dfd7; width: 100%; border-radius: 13px; padding: 12px 13px;
      display: flex; align-items: center; gap: 13px; background: transparent; cursor: pointer;
      text-align: left; font-size: 14px; font-weight: 590; transition: background .18s ease, color .18s ease;
    }
    .nav-button:hover { background: rgba(255,255,255,.08); color: #fff; }
    .nav-button.active { color: var(--forest); background: var(--lime); font-weight: 750; }
    .nav-icon { display: grid; place-items: center; width: 21px; height: 21px; }
    .nav-icon svg { width: 19px; height: 19px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .sidebar-spacer { flex: 1; }
    .sidebar-journey { padding: 17px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.1); border-radius: 18px; }
    .journey-top { display: flex; align-items: center; justify-content: space-between; font-size: 11px; color: #c6d4cc; }
    .journey-flame { color: var(--lime); font-size: 17px; }
    .journey-count { margin: 12px 0 4px; font-size: 24px; font-weight: 760; letter-spacing: -.05em; color: #fff; }
    .journey-caption { font-size: 11px; color: #bfcec5; line-height: 1.5; }
    .sidebar-bottom { font-size: 10px; line-height: 1.5; color: #a3b8ad; padding: 17px 12px 0; }
    .main-column { margin-left: 246px; min-height: 100vh; }
    .topbar { height: 76px; padding: 0 46px; display: flex; justify-content: space-between; align-items: center; gap: 14px; }
    .topbar-label { color: #69766e; font-size: 10px; letter-spacing: .08em; font-weight: 780; }
    .topbar-tools { display: flex; align-items: center; gap: 10px; }
    .accent-control { display: flex; align-items: center; gap: 8px; color: #7b877f; font-size: 9px; font-weight: 780; letter-spacing: .1em; }
    .accent-control select { max-width: 122px; border: 1px solid #dfe5dc; border-radius: 10px; background: #fff; color: #34483e; padding: 8px 9px; font: inherit; font-size: 10px; font-weight: 680; letter-spacing: 0; cursor: pointer; }
    .level-switch { display: inline-flex; align-items: center; gap: 7px; border: 1px solid #dfe5dc; border-radius: 999px; padding: 8px 11px; background: #fff; color: #355544; font-size: 10px; font-weight: 730; cursor: pointer; }
    .level-switch:hover { background: #edf4e9; border-color: #c8d9c9; }
    .level-switch span:last-child { color: #87958b; font-size: 12px; }
    main { max-width: 1440px; margin: 0 auto; padding: 18px 46px 70px; }
    .page { max-width: 1160px; margin: 0 auto; animation: enter .23s ease both; }
    @keyframes enter { from { opacity: .45; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    .eyebrow { color: #718078; text-transform: uppercase; letter-spacing: .14em; font-weight: 780; font-size: 10px; }
    .welcome-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; margin: 2px 0 28px; }
    h1, h2, h3, p { margin-top: 0; }
    .welcome-row h1 { margin: 10px 0 9px; font-size: clamp(34px, 4vw, 48px); line-height: 1.05; letter-spacing: -.06em; font-weight: 760; }
    .welcome-row h1 span { color: #668277; }
    .welcome-row p { color: #6f7b73; line-height: 1.6; margin: 0; font-size: 14px; max-width: 520px; }
    .day-pill { display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; padding: 10px 13px; border: 1px solid var(--line); background: rgba(255,255,255,.72); border-radius: 999px; color: #58675e; font-size: 11px; font-weight: 650; }
    .day-pill .dot { width: 7px; height: 7px; border-radius: 50%; background: #87b76b; }
    .hero-card { position: relative; overflow: hidden; min-height: 252px; border-radius: 26px; padding: 31px 35px; display: flex; justify-content: space-between; align-items: center; gap: 30px; background: var(--forest); color: white; box-shadow: 0 20px 48px rgba(23,59,50,.14); }
    .hero-copy { position: relative; z-index: 1; max-width: 570px; }
    .hero-tag { display: inline-flex; border-radius: 999px; padding: 7px 10px; align-items: center; gap: 7px; color: #e5f6a8; background: rgba(217,242,120,.13); font-weight: 780; font-size: 9px; letter-spacing: .11em; }
    .hero-tag .spark { font-size: 13px; }
    .hero-card h2 { font-size: clamp(24px, 2.7vw, 34px); line-height: 1.13; letter-spacing: -.055em; margin: 16px 0 10px; max-width: 470px; }
    .hero-card p { font-size: 13px; color: #c6d8ce; line-height: 1.65; margin: 0 0 20px; max-width: 470px; }
    .btn { border: 0; display: inline-flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer; border-radius: 12px; padding: 12px 16px; font-size: 12px; font-weight: 760; transition: transform .16s ease, box-shadow .16s ease, background .16s ease; }
    .btn:hover { transform: translateY(-1px); }
    .btn-primary { color: var(--forest); background: var(--lime); box-shadow: 0 7px 17px rgba(0,0,0,.08); }
    .btn-primary:hover { background: #e2f99a; }
    .btn-light { color: var(--forest); background: #fff; }
    .btn-quiet { background: #f0f3ee; color: #334a40; }
    .btn-outline { background: transparent; color: #53635a; border: 1px solid #dfe5dd; }
    .btn-small { padding: 9px 12px; font-size: 11px; border-radius: 10px; }
    .btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .hero-art { flex: 0 0 252px; height: 188px; position: relative; display: grid; place-items: center; }
    .hero-orbit { width: 172px; height: 172px; border: 1px solid rgba(236,246,224,.24); border-radius: 50%; position: relative; display: grid; place-items: center; transform: rotate(-12deg); }
    .hero-orbit::before, .hero-orbit::after { content: ""; position: absolute; border: 1px solid rgba(236,246,224,.19); border-radius: 50%; inset: 19px; }
    .hero-orbit::after { inset: 42px; background: rgba(217,242,120,.08); }
    .orbit-core { width: 67px; height: 67px; border-radius: 22px; background: var(--lime); color: var(--forest); z-index: 1; display: grid; place-items: center; transform: rotate(12deg); box-shadow: 0 8px 30px rgba(0,0,0,.17); }
    .orbit-core svg { width: 34px; height: 34px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    .orbit-word { position: absolute; z-index: 2; background: #fff; color: var(--forest); border-radius: 9px; padding: 8px 10px; font-size: 10px; font-weight: 760; box-shadow: 0 8px 20px rgba(0,0,0,.1); transform: rotate(12deg); }
    .orbit-word.one { left: -6px; top: 41px; }
    .orbit-word.two { right: -19px; top: 72px; transform: rotate(3deg); }
    .orbit-word.three { left: 37px; bottom: -3px; transform: rotate(-5deg); background: #f8c6ae; }
    .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin: 17px 0 39px; }
    .stat-card { padding: 17px 19px; background: rgba(255,255,255,.8); border: 1px solid var(--line); border-radius: 17px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .stat-title { font-size: 11px; color: #768279; font-weight: 620; }
    .stat-value { font-size: 22px; letter-spacing: -.045em; font-weight: 760; margin-top: 5px; }
    .stat-icon { width: 39px; height: 39px; display: grid; place-items: center; border-radius: 13px; background: #ecf2e4; font-size: 18px; }
    .section-heading { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin: 0 0 17px; }
    .section-heading h2 { margin: 0 0 5px; font-size: 19px; letter-spacing: -.04em; }
    .section-heading p { color: #778279; margin: 0; font-size: 12px; line-height: 1.5; }
    .text-button { border: 0; background: none; color: #3e6e5b; font-size: 11px; font-weight: 760; cursor: pointer; padding: 8px 0; }
    .text-button:hover { color: #1b4335; text-decoration: underline; }
    .world-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 13px; }
    .world-card { background: white; border: 1px solid var(--line); border-radius: 19px; padding: 17px; min-width: 0; transition: transform .17s ease, box-shadow .17s ease; }
    .world-card:hover { transform: translateY(-3px); box-shadow: var(--shadow); }
    .world-icon { width: 43px; height: 43px; border-radius: 14px; display: grid; place-items: center; font-size: 22px; margin-bottom: 13px; }
    .world-card h3 { font-size: 14px; margin: 0 0 6px; letter-spacing: -.025em; }
    .world-card p { font-size: 11px; line-height: 1.55; color: #79847c; margin: 0; min-height: 36px; }
    .world-progress-row { display: flex; justify-content: space-between; align-items: center; margin: 14px 0 8px; font-size: 9px; color: #859087; }
    .mini-track, .progress-track { background: #edf0ea; overflow: hidden; border-radius: 999px; height: 5px; }
    .mini-track span, .progress-track span { display: block; height: 100%; border-radius: inherit; background: #7ea98a; transition: width .25s ease; }
    .world-action { width: 100%; border: 0; padding: 11px 0 0; margin-top: 10px; border-top: 1px solid #eff1ed; display: flex; justify-content: space-between; align-items: center; cursor: pointer; background: transparent; color: #365b4a; font-size: 10px; font-weight: 760; }
    .world-action span:last-child { font-size: 16px; transition: transform .16s ease; }
    .world-action:hover span:last-child { transform: translateX(3px); }
    .lower-grid { display: grid; grid-template-columns: 1.2fr .8fr; gap: 14px; margin-top: 32px; }
    .week-card { display: flex; align-items: center; justify-content: space-between; gap: 24px; background: #fff; border: 1px solid var(--line); border-radius: 19px; padding: 18px 21px; margin: -20px 0 32px; }
    .week-copy { max-width: 340px; }
    .week-copy h3 { font-size: 14px; letter-spacing: -.025em; margin: 6px 0 4px; }
    .week-copy p { color: #7a867e; font-size: 10px; line-height: 1.5; margin: 0; }
    .week-days { display: flex; align-items: center; gap: 9px; }
    .week-day { display: grid; justify-items: center; gap: 5px; color: #8b958e; font-size: 8px; font-weight: 700; min-width: 31px; }
    .week-day b { width: 27px; height: 27px; display: grid; place-items: center; border: 1px solid #e7ebe4; border-radius: 50%; color: #869189; background: #fafbf8; font-size: 9px; font-weight: 700; }
    .week-day.active b { border-color: #bdd1a1; background: var(--lime); color: #36523b; animation: soft-pop .35s ease both; }
    .week-day.is-today b { outline: 2px solid var(--accent-text); outline-offset: 2px; }
    .week-day.future { opacity: .5; }
    .game-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 14px; }
    .learning-grid { grid-template-columns: repeat(3, minmax(0,1fr)); }
    .game-card { min-width: 0; display: flex; flex-direction: column; background: #fff; border: 1px solid var(--line); border-radius: 19px; padding: 17px; transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease; animation: card-rise .35s ease both; }
    .game-card:nth-child(2) { animation-delay: .035s; }
    .game-card:nth-child(3) { animation-delay: .07s; }
    .game-card:nth-child(4) { animation-delay: .105s; }
    .game-card:hover { transform: translateY(-3px); box-shadow: var(--shadow); border-color: #d4dfd4; }
    .game-card-top { display: flex; align-items: center; justify-content: space-between; gap: 7px; margin-bottom: 13px; }
    .game-icon { width: 40px; height: 40px; border-radius: 13px; display: grid; place-items: center; font-size: 20px; background: var(--game-tint); }
    .game-label { color: #75827a; font-size: 8px; line-height: 1.2; letter-spacing: .1em; font-weight: 800; text-align: right; }
    .game-card h3 { font-size: 14px; letter-spacing: -.03em; margin: 0 0 7px; }
    .game-card p { color: #77837b; font-size: 10px; line-height: 1.55; margin: 0; flex: 1; }
    .game-meta { display: flex; justify-content: space-between; gap: 7px; color: #89938c; font-size: 8px; margin: 14px 0 11px; }
    .game-play-button { min-height: 44px; border: 0; border-top: 1px solid #edf0ea; padding: 11px 0 0; background: transparent; color: #3c6851; font-size: 10px; font-weight: 760; display: flex; align-items: center; justify-content: space-between; cursor: pointer; text-align: left; }
    .game-play-button:hover { color: #1e4937; }
    .game-play-button span { font-size: 16px; transition: transform .18s ease; }
    .game-play-button:hover span { transform: translateX(3px); }
    .home-game-grid { grid-template-columns: repeat(3, minmax(0,1fr)); }
    .home-games { margin-top: 31px; }
    .home-worlds { margin-top: 33px; }
    .gentle-note { color: #b8cbbb; font-size: 9px; margin-top: 12px; }
    .gentle-footer { color: #849087; text-align: center; font-size: 10px; line-height: 1.6; margin: 19px 0 0; }
    .skill-suggestion { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 15px 18px; margin: -6px 0 18px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface-card); }
    .skill-suggestion strong { color: var(--text-primary); font-size: 13px; }
    .skill-suggestion p { color: var(--text-secondary); font-size: 11px; line-height: 1.5; margin: 4px 0 0; }
    .skill-suggestion button { flex-shrink: 0; }
    @media (max-width: 560px) { .skill-suggestion { align-items: stretch; flex-direction: column; } }
    .sampler-card { display: grid; grid-template-columns: minmax(0,1fr) auto; align-items: center; gap: 15px 24px; background: var(--forest); color: white; border-radius: 23px; padding: 23px 25px; margin: -6px 0 18px; overflow: hidden; }
    .sampler-card .eyebrow { color: #bdd2c4; }
    .sampler-card h2 { font-size: 21px; letter-spacing: -.045em; margin: 7px 0 5px; }
    .sampler-card p { color: #cfddd4; font-size: 11px; line-height: 1.55; margin: 0 0 12px; max-width: 490px; }
    .sampler-steps { display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.12); border-radius: 16px; padding: 13px; font-size: 20px; }
    .sampler-steps b { font-size: 11px; color: #b9cbbf; }
    .sampler-played { grid-column: 1 / -1; padding-top: 10px; border-top: 1px solid rgba(255,255,255,.14); color: #c6d6cc; font-size: 9px; }
    .mini-mode-pill { display: inline-flex; align-items: center; gap: 8px; background: var(--game-tint); border-radius: 999px; padding: 8px 11px; color: #405449; font-size: 9px; font-weight: 770; width: fit-content; }
    .mini-mode-pill > span:first-child { font-size: 15px; }
    .mini-band { border-left: 1px solid rgba(47,73,56,.18); margin-left: 3px; padding-left: 8px; text-transform: uppercase; font-size: 8px; letter-spacing: .05em; }
    .mini-game-layout { display: grid; grid-template-columns: minmax(0,1fr) 258px; gap: 18px; align-items: start; }
    .mini-question-card { min-width: 0; }
    .tier-badge { margin-left: auto; background: #e6f1e1; color: #4f7251; border-radius: 999px; padding: 5px 7px; font-size: 8px; font-weight: 760; white-space: nowrap; }
    .tier-badge.stretch { background: #f5ead9; color: #8a6940; }
    .opposite-chip { color: #7b5e70; background: #faf1f5; border-color: rgba(136,96,118,.14); }
    @keyframes card-rise { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes soft-pop { 0% { transform: scale(.88); } 65% { transform: scale(1.06); } 100% { transform: scale(1); } }
    .feature-card { min-height: 153px; background: #e9f0e6; border-radius: 20px; padding: 21px; display: flex; align-items: center; justify-content: space-between; gap: 14px; overflow: hidden; }
    .feature-card.tone-feature { background: #fae8df; }
    .feature-card h3 { margin: 8px 0 6px; font-size: 17px; letter-spacing: -.04em; }
    .feature-card p { color: #64756b; font-size: 11px; line-height: 1.5; margin: 0 0 13px; max-width: 340px; }
    .feature-symbol { flex: 0 0 64px; height: 64px; border-radius: 20px; display: grid; place-items: center; background: rgba(255,255,255,.55); font-size: 29px; transform: rotate(5deg); }
    .tone-feature .feature-symbol { background: rgba(255,255,255,.55); }
    .page-header { margin: 4px 0 27px; }
    .page-header h1 { margin: 8px 0 8px; font-size: clamp(30px,3vw,40px); line-height: 1.08; letter-spacing: -.055em; }
    .page-header p { margin: 0; max-width: 620px; line-height: 1.65; color: #758078; font-size: 13px; }
    .explore-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
    .explore-card { background: #fff; border: 1px solid var(--line); border-radius: 22px; overflow: hidden; }
    .explore-card-top { padding: 20px 21px 17px; display: flex; gap: 15px; align-items: flex-start; }
    .explore-card .world-icon { flex: 0 0 48px; margin: 0; }
    .explore-card h2 { font-size: 17px; margin: 1px 0 6px; letter-spacing: -.035em; }
    .explore-card p { color: #7b867e; font-size: 11px; line-height: 1.55; margin: 0; }
    .explore-card-bottom { padding: 14px 21px 18px; border-top: 1px solid #eef0eb; display: flex; justify-content: space-between; align-items: center; gap: 16px; }
    .scene-count { font-size: 10px; color: #7b867e; }
    .scene-count strong { color: #34483e; }
    .nuance-layout { display: grid; grid-template-columns: 240px 1fr; gap: 18px; align-items: start; }
    .family-panel { background: #fff; border: 1px solid var(--line); border-radius: 20px; padding: 16px; }
    .family-panel .eyebrow { padding: 4px 7px 10px; display: block; }
    .family-button { width: 100%; border: 0; background: transparent; text-align: left; cursor: pointer; border-radius: 12px; padding: 11px 10px; display: flex; align-items: center; justify-content: space-between; font-size: 12px; font-weight: 680; color: #58665e; }
    .family-button:hover { background: #f4f6f1; }
    .family-button.active { background: #edf4e9; color: #294a3a; }
    .family-button span:last-child { color: #8d9b91; font-size: 17px; }
    .nuance-content { min-width: 0; }
    .nuance-feature { background: var(--forest); color: white; border-radius: 21px; padding: 22px 23px; margin-bottom: 14px; }
    .nuance-feature .eyebrow { color: #bbd1c4; }
    .nuance-feature h2 { font-size: 24px; margin: 8px 0 7px; letter-spacing: -.05em; }
    .nuance-feature p { margin: 0; color: #d0dfd6; font-size: 12px; line-height: 1.6; max-width: 730px; }

  <script>
    // Keep implementation details and the vocabulary corpus out of the global namespace.

    (function wordtrailApp() {
    'use strict';

    // Original editorial selection of practical intermediate English vocabulary.
    // Not a frequency ranking, CEFR certification, or a licensed dictionary.
    const GROUPS = [
      ['Conversation', `respond reply explain clarify mention describe discuss suggest recommend request remind confirm correct interrupt pause continue emphasize acknowledge apologize compliment persuade negotiate announce introduce address express specify elaborate summarize rephrase interpret pronounce translate quote restate object agree disagree encourage assure reassure invite greet thank welcome excuse complain ask answer listen hear speak talk chat whisper mumble shout argue debate insist admit deny promise comment react`],
      ['Everyday actions', `arrange organize prepare gather collect carry deliver return replace repair restore adjust improve simplify compare select choose sort separate combine attach remove install connect disconnect open close lock unlock fold unfold wrap unwrap store borrow lend rent share offer accept refuse avoid notice observe examine inspect search discover locate identify recognize remember forget practice repeat attempt complete finish restart begin proceed stop settle manage handle maintain support protect prevent rescue assist`],
      ['Thinking and decisions', `consider evaluate assess estimate predict expect assume infer conclude decide determine prioritize plan propose review verify question doubt trust believe realize understand grasp learn recall recognize imagine visualize wonder reflect focus concentrate compare contrast distinguish classify calculate measure investigate research solve adapt revise rethink reconsider compromise commit approve reject hesitate hesitate deliberate judge weigh preference option alternative consequence outcome reason evidence argument assumption judgment perspective insight awareness intention purpose goal approach strategy method principle pattern context detail exception requirement condition possibility probability risk benefit drawback tradeoff priority solution obstacle opportunity challenge progress`],
      ['Feelings', `relieved worried anxious nervous confident uncertain hopeful disappointed frustrated annoyed irritated embarrassed grateful proud curious interested fascinated surprised shocked puzzled confused overwhelmed calm peaceful relaxed comfortable uneasy lonely cheerful joyful delighted content satisfied eager motivated tired exhausted drained stressed sensitive sympathetic considerate respectful affectionate patient resilient optimistic pessimistic cautious enthusiastic sincere genuine openhearted humble appreciative nostalgic restless  doubtful insecure reassured encouraged inspired discouraged`],
      ['Relationships', `friend colleague teammate neighbor partner relative sibling parent guardian cousin guest host stranger acquaintance mentor learner supporter volunteer companion roommate customer client visitor resident contact connection relationship friendship teamwork cooperation agreement boundary respect trust loyalty honesty kindness empathy patience support encouragement conflict disagreement misunderstanding apology forgiveness compromise consideration reliability dependence independence companionship community hospitality generosity`],
      ['Home and routines', `household apartment bedroom kitchen bathroom hallway balcony doorway cupboard drawer shelf blanket pillow mattress curtain towel mirror sink tap drain light switch socket charger kettle pan stove oven fridge freezer laundry basket washing detergent broom mop bucket sponge cloth tidy clutter mess stain leak crack shelf storage repair furniture table chair sofa desk lamp rug cushion lock key spare entrance exit corridor courtyard garden plant pot soil seed waste recycling bin groceries delivery package parcel schedule routine habit task chore appointment reminder rest sleep wake breakfast lunch dinner snack shower commute departure arrival`],
      ['Food and cooking', `ingredient recipe portion serving meal dish flavor taste aroma texture seasoning spice salt pepper sugar flour rice pasta bread dough batter soup broth salad sauce dressing yogurt cheese butter oil vinegar fruit vegetable onion garlic ginger tomato potato carrot bean lentil egg fish chicken meat seafood fresh ripe raw cooked baked roasted grilled fried steamed simmered boiled chopped sliced diced mixed stirred poured measured blended served shared leftover expiry nutrition balanced nutritious allergy appetite hungry thirsty delicious savory sweet sour bitter mild spicy crunchy tender juicy stale spoiled affordable filling homemade takeaway`],
      ['Health and wellbeing', `health healthy illness sickness symptom fever cough cold headache ache pain injury wound bruise swelling rash allergy infection recovery treatment therapy medicine medication prescription pharmacist clinic hospital doctor nurse patient appointment checkup examination diagnosis advice exercise movement stretch walk jog cycle breathing sleep rest fatigue stress anxiety focus hydration water hygiene soap mask vaccine prevention safety emergency urgent routine gradual improvement healing comfort support care nutrition energy stamina strength flexibility balance posture heartbeat temperature pressure breath dizziness nausea soreness fatigue relief`],
      ['Shopping and services', `shop store market stall vendor cashier clerk customer receipt refund exchange return warranty guarantee purchase payment invoice order check-out cart basket stock inventory available unavailable supply demand discount offer deal bargain price cost value budget affordable reasonable expensive cheap quality brand size fit measurement fabric material color pattern style sample label package delivery shipping pickup queue counter booking reservation service support complaint issue request confirmation cancellation policy repair replacement charge fee deposit balance change cash card transfer transaction account`],
      ['Travel and directions', `journey trip route destination departure arrival delay cancellation connection transfer station terminal platform stop schedule timetable ticket fare reservation booking passenger driver conductor vehicle bus train ferry flight bicycle taxi traffic crossing junction intersection bridge tunnel street road lane pavement sidewalk path trail map sign signal direction landmark distance nearby distant local regional border passport luggage baggage suitcase backpack carry-on gate entrance exit security inspection accommodation hotel guesthouse hostel room check-in check-out detour shortcut commute navigation guide tourist visitor itinerary forecast weather delay lost found missed early late on-time`],
      ['Work and projects', `workplace colleague employer employee manager supervisor client customer supplier team meeting agenda minutes deadline task assignment project proposal presentation report update feedback revision draft document file folder spreadsheet record data analysis budget estimate schedule milestone deliverable priority responsibility accountability initiative coordination collaboration communication negotiation agreement contract policy procedure approval request follow-up progress obstacle issue solution outcome performance productivity efficiency accuracy reliability consistency quality safety training support review evaluation promotion interview application vacancy position career skill experience leadership delegation workload handover shift remote hybrid onsite`],
      ['Learning and study', `student teacher tutor lesson class course subject topic unit chapter page paragraph sentence word phrase vocabulary grammar spelling pronunciation meaning definition example explanation instruction direction question answer exercise practice revision review recall memory knowledge understanding skill ability reading writing listening speaking discussion lecture presentation assignment homework deadline submission worksheet notebook textbook dictionary source reference citation evidence claim conclusion summary outline draft edit correction feedback grade score result progress curiosity inquiry investigation experiment observation measurement calculation formula diagram chart graph table comparison contrast research study project library laboratory campus classroom group partner exam test quiz assessment`],
      ['Money and budgeting', `income wage salary allowance savings saving expense spending payment purchase price cost fee charge tax discount bargain refund credit debit debt loan interest rent mortgage deposit balance account transfer cash change bill invoice receipt budget estimate limit value worth profit loss revenue investment insurance subscription instalment installment transaction withdrawal deposit statement currency exchange rate emergency fund financial plan affordable reasonable expensive economical frugal generous wasteful overdue due reserve repay earn borrow lend donate contribute share split cover settle negotiate`],
      ['Technology and communication', `device phone tablet laptop computer screen display keyboard mouse speaker microphone camera battery charger cable adapter wireless network internet connection signal data storage memory file folder document download upload install update upgrade restart reset setting option menu button link browser website webpage app application account profile username password passcode privacy security permission access notification message email inbox attachment reply forward search filter sort save edit delete backup restore sync offline online error bug fix support video call meeting voice recording transcript subtitle translation language font contrast zoom accessibility login logout verification confirmation`],
      ['Nature and weather', `weather forecast climate temperature humidity breeze wind storm thunder lightning rain rainfall drizzle shower flood drought heat sunshine sunlight shadow shade cloud fog mist snow frost ice river lake pond stream waterfall ocean sea coast beach island mountain hill valley forest woodland tree branch leaf root seed flower grass field soil sand mud stone rock wildlife animal bird insect habitat environment pollution recycling conservation protection renewable energy power solar sunlight windmill resource water air carbon emission sustainability erosion season spring summer autumn winter morning evening sunset sunrise`],
      ['Community and civic life', `neighborhood resident citizen community volunteer organizer committee council clinic library school park garden public private local regional service facility event festival celebration meeting announcement notice campaign awareness donation charity support shelter assistance access accessibility inclusion diversity respect cooperation participation contribution leadership improvement planning safety crossing traffic waste collection recycling water supply maintenance repair proposal feedback complaint concern petition policy rule regulation permission registration application deadline opening hours schedule transport healthcare education housing`],
      ['Time and planning', `today tomorrow yesterday morning afternoon evening night weekday weekend calendar date day week month year moment period duration interval appointment schedule timetable deadline reminder routine habit plan priority urgent immediate soon later earlier before after during meanwhile eventually recently previously currently regularly occasionally frequently rarely daily weekly monthly annually temporary permanent flexible available unavailable punctual early late delayed overdue upcoming pending complete finished progress pause continue resume postpone reschedule cancel confirm estimate allow prepare anticipate coordinate arrange organize reserve book`],
      ['Descriptions and qualities', `clear vague precise accurate reliable consistent practical efficient effective useful helpful relevant significant essential necessary optional suitable appropriate reasonable affordable comfortable convenient accessible available secure safe durable sturdy fragile delicate flexible adaptable simple complex complicated detailed concise brief thorough careful cautious confident calm polite respectful honest sincere genuine generous modest humble patient curious eager experienced skilled capable prepared organized tidy messy crowded bustling quiet peaceful noisy gentle harsh warm cool fresh stale ripe tender solid smooth rough bright dim narrow wide spacious compact heavy light strong weak`],
      ['Writing and media', `message note letter email report summary outline draft paragraph chapter headline title caption label comment review article essay story dialogue conversation speech presentation interview announcement notice poster advertisement brochure guide manual instruction description explanation example argument evidence claim source reference quotation citation edit revision correction proofread publish share forward attach download upload record transcript subtitle translation meaning tone voice audience purpose clarity precision structure format grammar punctuation spelling phrase sentence transition connector introduction conclusion`],
      ['Useful expressions', ``]
    ];
    // Expressions are inserted separately as whole units; whitespace separates single-word entries.
    const BASE = GROUPS.filter(([topic]) => topic !== 'Useful expressions').flatMap(([topic, text]) => text.split(/\s+/).map(word => ({ word: word.toLowerCase(), topic })));
    const EXPRESSIONS = `follow up|meet a deadline|raise a concern|reach an agreement|take responsibility|keep someone updated|set priorities|make a decision|address an issue|request clarification|provide feedback|make an adjustment|manage expectations|reach out|take into account|work out a solution|stick to the plan|share the workload|ask for input|run into a problem|look into it|come up with an idea|put together a proposal|carry out a task|hand over a project|pay attention|take notes|hand in an assignment|catch up|figure out|check your work|draw a conclusion|make a point|back up a claim|look up a word|break down a problem|compare and contrast|take part in a discussion|ask a follow-up question|put an idea into words|see the bigger picture|make a connection|test an assumption|stay on topic|sum up|take a detour|allow extra time|keep in touch|make the most of|keep an open mind|hear someone out|settle in|look out for|follow through|make a difference|give back|speak up|set a boundary|make room|make progress|take a break`.split('|').map(word => ({ word, topic: 'Useful expressions' }));
    const seen = new Set();
    const ESSENTIAL_WORDS = [...BASE, ...EXPRESSIONS].filter(entry => {
      if (!/^[a-z][a-z -]{1,55}$/.test(entry.word) || seen.has(entry.word)) return false;
      seen.add(entry.word);
      return true;
    });
    const ESSENTIAL_TOPICS = [...new Set(ESSENTIAL_WORDS.map(entry => entry.topic))];
    
    const ENVIRONMENTS = [
      { id: 'campus', name: 'Campus', icon: '🎒', color: '#e8f0dc', short: 'Classes, labs & curious questions', description: 'Find precise words for lessons, ideas, and campus conversations.' },
      { id: 'market', name: 'City market', icon: '🧺', color: '#faeadc', short: 'Shops, streets & small discoveries', description: 'Practice the language of shopping, bargaining, and busy city life.' },
      { id: 'workplace', name: 'Workplace', icon: '🗂️', color: '#e2edf2', short: 'Teams, projects & clear communication', description: 'Choose words that help you sound clear, calm, and professional.' },
      { id: 'home', name: 'Home & friends', icon: '🪴', color: '#f5e7ed', short: 'Everyday moments & warm conversations', description: 'Build expressive vocabulary for the familiar moments of daily life.' },
      { id: 'travel', name: 'On the move', icon: '🧭', color: '#eee8d9', short: 'Journeys, detours & new places', description: 'Make sense of the words you need while traveling and exploring.' }
    ];

    const QUESTIONS = [
      { id: 'curious', env: 'campus', scene: 'A science demonstration', sentence: 'During the science demo, Jo was ____ about why the liquid changed color and asked three questions.', hint: 'Look for a word that describes wanting to know more.', options: ['curious', 'careless', 'exhausted', 'ordinary'], answer: 'curious', definition: 'Curious means eager to learn or know about something.', nuance: 'Inquisitive is a close relative and often suggests asking many questions. Interested is broader: you can be interested without actively investigating.', example: 'The curious student stayed after class to examine the model.', family: 'Wanting to know' },
      { id: 'concise', env: 'campus', scene: 'A study group', sentence: 'The tutor asked for a ____ summary: just the main point in two sentences.', hint: 'The tutor wants it brief, but still clear.', options: ['concise', 'vague', 'elaborate', 'casual'], answer: 'concise', definition: 'Concise means short and clear, using no more words than needed.', nuance: 'Brief means short in length. Concise adds the idea of being clear and economical; a short answer can still be vague.', example: 'Her concise notes made revision much easier.', family: 'Brief & clear' },
      { id: 'puzzled', env: 'campus', scene: 'Reading a tricky direction', sentence: 'Mina looked ____ when the directions seemed to contradict each other.', hint: 'She is unsure because something does not make sense.', options: ['puzzled', 'confident', 'relieved', 'generous'], answer: 'puzzled', definition: 'Puzzled means confused or unsure because something is difficult to understand.', nuance: 'Confused is more general. Puzzled often suggests there is a specific question or mystery to work out.', example: 'He was puzzled by the final step in the instructions.', family: 'Confused & curious' },
      { id: 'accurate', env: 'campus', scene: 'Finishing a lab report', sentence: 'Before submitting the lab report, check that every measurement is ____.', hint: 'The numbers need to match the facts exactly.', options: ['accurate', 'vivid', 'brief', 'polite'], answer: 'accurate', definition: 'Accurate means correct and close to the true value or facts.', nuance: 'Precise means exact and carefully defined. A measurement can be precise in detail; accurate means it is actually correct.', example: 'The map is accurate enough to find the trailhead.', family: 'Correct & exact' },
      { id: 'inspect', env: 'market', scene: 'Choosing a mango', sentence: 'She turned the mango in her hand to ____ its skin for bruises.', hint: 'She is checking it carefully, not just looking briefly.', options: ['inspect', 'announce', 'borrow', 'ignore'], answer: 'inspect', definition: 'Inspect means to look at something carefully, often to check its condition or details.', nuance: 'Examine is a close synonym. Glance means to look very quickly, so it would not fit a careful check.', example: 'The mechanic inspected the bicycle before the trip.', family: 'Looking carefully' },
      { id: 'bustling', env: 'market', scene: 'A lunch-hour café', sentence: 'The café was so ____ at lunchtime that we could barely hear each other.', hint: 'It was full of activity, movement, and noise.', options: ['bustling', 'deserted', 'silent', 'fragile'], answer: 'bustling', definition: 'Bustling describes a place full of energetic activity and people.', nuance: 'Busy is more general. Bustling usually gives a lively, crowded impression; it does not simply mean noisy.', example: 'The bustling station was full of commuters.', family: 'Busy & lively' },
      { id: 'reasonable', env: 'market', scene: 'Paying for a repair', sentence: 'The tailor charged a ____ price: fair, and not higher than expected.', hint: 'The amount feels fair and sensible.', options: ['reasonable', 'reckless', 'distant', 'bitter'], answer: 'reasonable', definition: 'Reasonable means fair, sensible, or not excessive in the situation.', nuance: 'Affordable means you can pay for it. Reasonable means the price seems fair, even if it is not the cheapest.', example: 'We found a reasonable room near the station.', family: 'Fair & sensible' },
      { id: 'ripe', env: 'market', scene: 'Picking fresh fruit', sentence: 'The mango is soft and fragrant, so it is probably ____.', hint: 'It is ready to eat, not raw or overripe.', options: ['ripe', 'stale', 'hollow', 'narrow'], answer: 'ripe', definition: 'Ripe describes fruit that has developed enough to be ready to eat.', nuance: 'Mature can describe something fully developed, but ripe is the everyday word for ready-to-eat fruit.', example: 'Choose a ripe peach that gives slightly when pressed.', family: 'Food & freshness' },
      { id: 'composed', env: 'workplace', scene: 'A difficult client call', sentence: 'Even when the client complained, Arun stayed ____ and answered calmly.', hint: 'He kept control of his feelings instead of panicking.', options: ['composed', 'frantic', 'blunt', 'careless'], answer: 'composed', definition: 'Composed means calm and in control, especially in a stressful moment.', nuance: 'Calm is the broad everyday word. Composed suggests someone is managing their reactions and not showing panic.', example: 'She remained composed while presenting to the board.', family: 'Calm & steady' },
      { id: 'practical', env: 'workplace', scene: 'Planning a small pilot', sentence: 'The team chose a ____ solution they could test this week with their current budget.', hint: 'The plan is useful and realistic, not just exciting in theory.', options: ['practical', 'imaginary', 'delicate', 'distant'], answer: 'practical', definition: 'Practical describes an idea or plan that is useful and possible to carry out.', nuance: 'Feasible means it can be done. Practical often adds that it is useful in real conditions.', example: 'A practical checklist helped the team avoid missed steps.', family: 'Useful & realistic' },
      { id: 'diplomatic', env: 'workplace', scene: 'Disagreeing in a meeting', sentence: 'She chose a ____ reply that expressed disagreement without embarrassing her colleague.', hint: 'She handled a sensitive situation with tact.', options: ['diplomatic', 'reckless', 'harsh', 'vague'], answer: 'diplomatic', definition: 'Diplomatic means tactful and careful with other people’s feelings, especially during disagreement.', nuance: 'Tactful is a close synonym. Diplomatic often suggests carefully balancing different people or interests.', example: 'He gave a diplomatic answer to a difficult question.', family: 'Tact & tone' },
      { id: 'reliable', env: 'workplace', scene: 'Choosing a supplier', sentence: 'We need a ____ supplier who delivers on the promised date every time.', hint: 'The team needs someone they can depend on.', options: ['reliable', 'temporary', 'vivid', 'nervous'], answer: 'reliable', definition: 'Reliable means dependable and likely to do what is expected.', nuance: 'Trustworthy is often about honesty. Reliable is often about consistently doing what you promised.', example: 'A reliable teammate lets the whole group plan ahead.', family: 'Trust & dependability' },
      { id: 'cozy', env: 'home', scene: 'A quiet reading corner', sentence: 'The blanket, warm light, and soft music made the reading corner feel ____.', hint: 'The space feels warm, comfortable, and inviting.', options: ['cozy', 'crowded', 'sharp', 'formal'], answer: 'cozy', definition: 'Cozy means pleasantly warm, comfortable, and snug.', nuance: 'Comfortable is broader. Cozy often suggests a small, warm, welcoming place or feeling.', example: 'We spent the rainy evening in a cozy little café.', family: 'Comfort & warmth' },
      { id: 'frugal', env: 'home', scene: 'Making a household budget', sentence: 'By cooking at home and repairing old things, he lived a ____ lifestyle.', hint: 'He spends carefully and avoids unnecessary costs.', options: ['frugal', 'extravagant', 'hurried', 'noisy'], answer: 'frugal', definition: 'Frugal means careful about spending money or using resources.', nuance: 'Thrifty is a friendly close synonym. Cheap can sound negative and may describe poor quality, not careful spending.', example: 'A frugal shopper compares prices before buying.', family: 'Saving & spending' },
      { id: 'murmured', env: 'home', scene: 'Someone is asleep nearby', sentence: 'Not wanting to wake anyone, she ____ the answer under her breath.', hint: 'She spoke softly and quietly.', options: ['murmured', 'announced', 'shouted', 'declared'], answer: 'murmured', definition: 'Murmured means spoke in a low, soft voice.', nuance: 'Whispered is even quieter and usually made without using the full voice. Muttered can sound annoyed or unclear.', example: '“I think it’s in the drawer,” he murmured.', family: 'Ways of speaking' },
      { id: 'sturdy', env: 'home', scene: 'Setting up a small table', sentence: 'The table did not wobble under the books; it was surprisingly ____.', hint: 'It is strong and solid, not flimsy.', options: ['sturdy', 'flimsy', 'fancy', 'hollow'], answer: 'sturdy', definition: 'Sturdy means strong and solid enough to last or support weight.', nuance: 'Durable emphasizes lasting over time. Sturdy emphasizes physical strength and stability.', example: 'The sturdy chair held up well through years of use.', family: 'Strength & build' },
      { id: 'detour', env: 'travel', scene: 'A bridge is closed', sentence: 'With the main bridge closed, the driver took a ____ through nearby streets.', hint: 'The usual route is blocked, so the driver goes another way.', options: ['detour', 'destination', 'border', 'platform'], answer: 'detour', definition: 'A detour is a route taken to avoid a closed or blocked road, or to go around something.', nuance: 'An alternative route is any different route. A detour is often temporary or less direct because the usual way is unavailable.', example: 'Roadworks forced us to take a detour through the village.', family: 'Routes & journeys' },
      { id: 'frequent', env: 'travel', scene: 'A local bus route', sentence: 'The bus makes ____ stops, so the journey takes longer than the express service.', hint: 'There are many stops, happening again and again.', options: ['frequent', 'rare', 'private', 'narrow'], answer: 'frequent', definition: 'Frequent means happening or appearing often.', nuance: 'Regular means happening at predictable intervals. Frequent focuses on how often something happens.', example: 'Frequent breaks helped everyone stay focused.', family: 'How often' },
      { id: 'hospitable', env: 'travel', scene: 'Staying with a local family', sentence: 'The family welcomed us with a meal and a comfortable place to stay; they were ____.', hint: 'They made their guests feel welcome.', options: ['hospitable', 'impatient', 'severe', 'distant'], answer: 'hospitable', definition: 'Hospitable describes someone who is welcoming and generous to guests.', nuance: 'Friendly describes a warm manner generally. Hospitable specifically describes welcoming visitors or guests.', example: 'Our hosts were hospitable and made us feel at home.', family: 'Welcoming & kind' },
      { id: 'serene', env: 'travel', scene: 'A lake at sunrise', sentence: 'The lake was still and peaceful at sunrise; the whole scene felt ____.', hint: 'The scene feels quiet and untroubled.', options: ['serene', 'hectic', 'harsh', 'cramped'], answer: 'serene', definition: 'Serene means calm, peaceful, and undisturbed.', nuance: 'Quiet describes low sound. Serene describes a peaceful quality or atmosphere, which can be quiet but is not only about sound.', example: 'The garden felt serene after the rain.', family: 'Calm places' },
      { id: 'helpful', env: 'campus', scene: 'Finding a book', sentence: 'The librarian was ____ and walked us to the shelf with the book we needed.', hint: 'They made it easier for us to get the help we needed.', options: ['helpful', 'careless', 'distant', 'sleepy'], answer: 'helpful', definition: 'Helpful means willing to help, or making a task easier.', nuance: 'Useful describes something that helps you do a task; helpful often describes a person, action, or piece of information.', example: 'The helpful classmate showed me where to submit the form.', family: 'Everyday people & actions', band: 'Everyday' },
      { id: 'clear', env: 'campus', scene: 'Explaining a science rule', sentence: 'After the teacher gave an example, the instructions were ____ and everyone understood them.', hint: 'The meaning was easy to understand.', options: ['clear', 'crowded', 'fragile', 'urgent'], answer: 'clear', definition: 'Clear means easy to understand or see, with little confusion.', nuance: 'Understandable is a close synonym. Brief only means short; a brief explanation can still be unclear.', example: 'Please give a clear example of how to solve it.', family: 'Easy to understand', band: 'Everyday' },
      { id: 'difficult', env: 'campus', scene: 'A final exam question', sentence: 'The final question was ____; it took me ten minutes to work it out.', hint: 'It was not easy to do.', options: ['difficult', 'simple', 'nearby', 'polite'], answer: 'difficult', definition: 'Difficult means not easy to do, understand, or deal with.', nuance: 'Hard is the common everyday synonym. Challenging can sound more positive, as if the task is demanding but worthwhile.', example: 'The last part of the puzzle was difficult.', family: 'Difficulty & effort', band: 'Everyday' },
      { id: 'confident', env: 'campus', scene: 'Presenting a class project', sentence: 'After practicing several times, Asha felt ____ enough to present her project to the class.', hint: 'She felt sure she could do it.', options: ['confident', 'confused', 'exhausted', 'narrow'], answer: 'confident', definition: 'Confident means feeling sure about your ability or about what you believe.', nuance: 'Self-assured is a close synonym. Certain usually means sure that something is true, not necessarily sure of your own ability.', example: 'He felt confident answering questions about his project.', family: 'Confidence & certainty', band: 'Everyday' },
      { id: 'quiet', env: 'campus', scene: 'The library', sentence: 'The library was ____; we could hear only the soft sound of pages turning.', hint: 'There was very little noise.', options: ['quiet', 'noisy', 'busy', 'rough'], answer: 'quiet', definition: 'Quiet means making little or no noise, or having little activity.', nuance: 'Silent means completely without sound. Quiet allows a little sound, as in this library.', example: 'We found a quiet table near the window.', family: 'Sound & atmosphere', band: 'Everyday' },
      { id: 'easy', env: 'campus', scene: 'Following a set of directions', sentence: 'The directions were ____ to follow, so I finished the form in two minutes.', hint: 'The task did not require much effort.', options: ['easy', 'difficult', 'urgent', 'messy'], answer: 'easy', definition: 'Easy means not difficult or requiring little effort.', nuance: 'Simple often means not complicated. Easy means not hard to do; something can be simple but still take effort.', example: 'The first exercise is easy once you see the pattern.', family: 'Difficulty & effort', band: 'Everyday' },
      { id: 'affordable', env: 'market', scene: 'Choosing a backpack', sentence: 'The backpack was good quality and ____ enough for my budget.', hint: 'The price fit what I could spend.', options: ['affordable', 'broken', 'distant', 'crowded'], answer: 'affordable', definition: 'Affordable means priced low enough for someone to pay for it.', nuance: 'Inexpensive is a close synonym. Cheap can also mean low-priced, but sometimes suggests poor quality.', example: 'We found an affordable place to eat near the station.', family: 'Money & value', band: 'Everyday' },
      { id: 'fresh', env: 'market', scene: 'Buying bread', sentence: 'The bread was baked this morning, so it was still ____ and smelled wonderful.', hint: 'It had been made recently, not left out for a long time.', options: ['fresh', 'stale', 'empty', 'late'], answer: 'fresh', definition: 'Fresh means recently made, picked, or prepared, and not old or spoiled.', nuance: 'New is broader. Fresh is especially common for food and for things that feel clean or recently prepared.', example: 'We bought fresh vegetables at the market.', family: 'Food & freshness', band: 'Everyday' },
      { id: 'busy', env: 'market', scene: 'Rush-hour street', sentence: 'The street became ____ at rush hour, with people crossing and shops full of customers.', hint: 'There was a lot of activity and many people.', options: ['busy', 'empty', 'silent', 'gentle'], answer: 'busy', definition: 'Busy describes a person with a lot to do or a place with lots of activity.', nuance: 'Crowded focuses on the number of people or things in a space. Busy focuses on activity; a place can be busy without feeling packed.', example: 'The market gets busy just before lunch.', family: 'Activity & crowds', band: 'Everyday' },
      { id: 'expensive', env: 'market', scene: 'Looking at a jacket', sentence: 'The jacket cost much more than I planned to spend; it was too ____.', hint: 'Its price was high.', options: ['expensive', 'affordable', 'fresh', 'quiet'], answer: 'expensive', definition: 'Expensive means costing a lot of money.', nuance: 'Costly is a close synonym, but expensive is the more common everyday choice.', example: 'That restaurant is a little too expensive for us tonight.', family: 'Money & value', band: 'Everyday' },
